name: Auto-merge Dependabot PRs

# Approves Dependabot PRs and enables auto-merge; the merge happens only once the required
# checks on main (ci) pass. Calls this repo's own reusable workflow; under pull_request_target
# the local reference resolves to the version on main. See README.md.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: ./.github/workflows/auto-merge-dependabot.yaml
    secrets: inherit
