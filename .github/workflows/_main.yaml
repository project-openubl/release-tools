name: PR tests

# `ci` is a required status check on main (Dependabot auto-merge waits for it), so this
# workflow must run on every PR: a paths-ignore would leave docs-only PRs stuck pending.
on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      config: ${{ steps.filter.outputs.config }}
      milestone: ${{ steps.filter.outputs.milestone }}
      labels: ${{ steps.filter.outputs.labels }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v3.0.4
        id: filter
        with:
          filters: |
            config:
              - "pkg/config/config.yaml"
            milestone:
              - "cmd/milestones/**"
            labels:
              - "cmd/labels/**"

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Rust
        uses: Swatinem/rust-cache@v2.9.3
      - name: Crate Format
        run: cargo fmt --check
      - name: Crate Check
        run: cargo check
      - name: Crate Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Crate Test
        run: cargo test

  check-milestones:
    needs: build
    if: ${{ needs.build.outputs.config == 'true' || needs.build.outputs.milestone == 'true' }}
    runs-on: ubuntu-latest
    permissions: read-all
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: RUST_LOG=info cargo run --bin milestones -- --config pkg/config/config.yaml

  check-labels:
    needs: build
    if: ${{ needs.build.outputs.config == 'true' || needs.build.outputs.milestone == 'true' }}
    runs-on: ubuntu-latest
    permissions: read-all
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: RUST_LOG=info cargo run --bin labels -- --config pkg/config/config.yaml
